# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "viola_asio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ASIO driver DLL (COM in-process server) that feeds the viola-bridge channel bed to the Omniphony renderer"

# cdylib: the `viola_asio.dll` the host loads through CoCreateInstance.
# rlib:   lets the unit tests link the crate directly.
[lib]
name = "viola_asio"
crate-type = ["cdylib", "rlib"]

# No dependencies, on purpose: docs/viola-asio-contract.md freezes the vtable by
# hand, and once the COM ABI is hand-rolled there is nothing left for the
# `windows` crate to buy us. `std`/`core` only.
[dependencies]
