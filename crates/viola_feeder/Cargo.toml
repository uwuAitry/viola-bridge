[package]
name = "viola_feeder"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Feeds live Windows audio (WASAPI) into orender's named pipe as a streaming WAV channel bed"

[[bin]]
name = "viola_feeder"
path = "src/main.rs"

# Windows-only by nature. No SDK is involved: `wasapi` is MIT and binds
# Microsoft's `windows` crate, which ships with the toolchain.
[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
